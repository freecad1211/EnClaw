name: EnClaw Core Tests

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python syntax
        run: python -m compileall -q enclaw_core
      - name: Run policy, provider, and Git isolation tests
        run: python -m unittest discover -s enclaw_core -t . -v
